name: YIX News backend CI

on:
  push:
    branches: [master, "update/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q app tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
